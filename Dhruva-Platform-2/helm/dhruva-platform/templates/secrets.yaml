apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dhruva-platform.fullname" . }}-secrets
  labels:
    {{- include "dhruva-platform.labels" . | nindent 4 }}
type: Opaque
data:
  # Database passwords
  mongodb-password: {{ .Values.secrets.mongodbPassword | b64enc | quote }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  timescaledb-password: {{ .Values.secrets.timescaledbPassword | b64enc | quote }}
  rabbitmq-password: {{ .Values.secrets.rabbitmqPassword | b64enc | quote }}

  # API keys and secrets
  heartbeat-api-key: {{ .Values.secrets.heartbeatApiKey | b64enc | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}

  # External service credentials
  {{- if .Values.secrets.azureStorageConnectionString }}
  azure-storage-connection-string: {{ .Values.secrets.azureStorageConnectionString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.emailCredentials }}
  email-credentials: {{ .Values.secrets.emailCredentials | b64enc | quote }}
  {{- end }}