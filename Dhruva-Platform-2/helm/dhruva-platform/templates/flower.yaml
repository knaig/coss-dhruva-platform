{{- if .Values.flower.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dhruva-platform.fullname" . }}-flower
  labels:
    {{- include "dhruva-platform.flower.labels" . | nindent 4 }}
spec:
  type: {{ .Values.flower.service.type }}
  ports:
    - port: {{ .Values.flower.service.port }}
      targetPort: {{ .Values.flower.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "dhruva-platform.flower.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dhruva-platform.fullname" . }}-flower
  labels:
    {{- include "dhruva-platform.flower.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.flower.replicaCount }}
  selector:
    matchLabels:
      {{- include "dhruva-platform.flower.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "dhruva-platform.flower.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dhruva-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: flower
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "dhruva-platform.image" .Values.flower.image }}
          imagePullPolicy: {{ .Values.flower.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.flower.service.targetPort }}
              protocol: TCP
          env:
            - name: CELERY_BROKER_URL
              value: "amqp://admin:$(RABBITMQ_PASSWORD)@{{ include "dhruva-platform.fullname" . }}-rabbitmq:5672/dhruva_host"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dhruva-platform.fullname" . }}-secrets
                  key: rabbitmq-password
          envFrom:
            - configMapRef:
                name: {{ include "dhruva-platform.fullname" . }}-config
          command:
            - "celery"
            - "flower"
            - "--broker=$(CELERY_BROKER_URL)"
            - "--address=$(CELERY_FLOWER_ADDRESS)"
            - "--port=$(CELERY_FLOWER_PORT)"
            - "--logging=$(FLOWER_LOGGING_LEVEL)"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}