apiVersion: v2
name: dhruva-platform
description: A Helm chart for Dhruva AI Platform - Full-fledged platform for serving AI models at scale
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/AI4Bharat/Dhruva-Platform
sources:
  - https://github.com/AI4Bharat/Dhruva-Platform
maintainers:
  - name: AI4Bharat
    email: contact@ai4bharat.org
keywords:
  - ai
  - machine-learning
  - nlp
  - speech
  - translation
  - indian-languages
  - fastapi
  - nextjs
  - mongodb
  - redis
  - celery
  - prometheus
  - grafana

dependencies:
  - name: mongodb
    version: "13.18.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled
    tags:
      - database
  - name: redis
    version: "18.1.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
    tags:
      - cache
  - name: rabbitmq
    version: "12.5.6"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
    tags:
      - messagequeue
  - name: prometheus
    version: "25.8.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
    tags:
      - monitoring
  - name: grafana
    version: "7.0.19"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
    tags:
      - monitoring

annotations:
  category: AI/ML Platform
  licenses: MIT